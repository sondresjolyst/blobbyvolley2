name: Release

on:
  push:
    branches:
      - main
  # A manual run is a dry run. It builds the image and the packages
  # but pushes and uploads nothing.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    uses: equinor/ops-actions/.github/workflows/release-please-manifest.yml@dae4f55b517888e44a342a5f7d3dfac40580a127 # v9.44.0
    permissions:
      contents: write
      pull-requests: write

  get-version:
    name: Get release version
    needs: release-please
    if: always() && (needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Read the tag release-please created
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAMES: ${{ needs.release-please.outputs.path_tag_names }}
        run: |
          if [ "$EVENT_NAME" != "push" ]; then
            {
              echo "tag="
              echo "version=dry-run"
              echo "publish=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(echo "$TAG_NAMES" | jq -r '.["."] // empty')
          # Release-please leaves the root package out of path_tag_names, so read the version it released.
          if [ -z "$tag" ]; then
            tag="v$(jq -r '.["."]' .release-please-manifest.json)"
          fi
          if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Unexpected release tag '$tag'"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"

  docker:
    name: Server image
    needs: get-version
    if: always() && needs.get-version.result == 'success'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/docker.yaml
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    with:
      tag: ${{ needs.get-version.outputs.version }}
      tag_latest: true
      push: ${{ needs.get-version.outputs.publish == 'true' }}

  windows:
    name: Windows package
    needs: get-version
    if: always() && needs.get-version.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/windows-package.yaml
    with:
      version: ${{ needs.get-version.outputs.version }}
      release_tag: ${{ needs.get-version.outputs.tag }}

  # Each arch attaches its zip on its own, so a late arch does not hold back the other.
  macos-arm64:
    name: macOS arm64 package
    needs: get-version
    if: always() && needs.get-version.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/macos-package.yaml
    with:
      version: ${{ needs.get-version.outputs.version }}
      release_tag: ${{ needs.get-version.outputs.tag }}
      arch: arm64

  macos-x64:
    name: macOS x64 package
    needs: get-version
    if: always() && needs.get-version.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/macos-package.yaml
    with:
      version: ${{ needs.get-version.outputs.version }}
      release_tag: ${{ needs.get-version.outputs.tag }}
      arch: x64

  linux:
    name: Linux package
    needs: get-version
    if: always() && needs.get-version.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/linux-package.yaml
    with:
      version: ${{ needs.get-version.outputs.version }}
      release_tag: ${{ needs.get-version.outputs.tag }}

  # Runs when a platform failed or the run was cancelled too, so the manifest lists the packages
  # that did attach. The release repair builds the missing ones and signs the manifest again.
  update-manifest:
    name: Update manifest
    needs: [get-version, windows, macos-arm64, macos-x64, linux]
    if: always() && needs.get-version.outputs.publish == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/update-manifest.yaml
    with:
      tag: ${{ needs.get-version.outputs.tag }}
