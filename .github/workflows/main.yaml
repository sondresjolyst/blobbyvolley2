name: Build

on:
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - "AUTHORS"
      - "ChangeLog"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Build:
    permissions:
      contents: read
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
        - { name: Windows (UCRT64),  os: windows-latest, shell: 'msys2 {0}', msystem: ucrt64,  msys-env: mingw-w64-ucrt-x86_64 }
        - { name: Windows (MINGW64), os: windows-latest, shell: 'msys2 {0}', msystem: mingw64, msys-env: mingw-w64-x86_64 }
        - { name: Ubuntu 22.04,      os: ubuntu-22.04,   shell: sh }
        - { name: Ubuntu 24.04,      os: ubuntu-24.04,   shell: sh }
        - { name: macOS,             os: macos-latest,   shell: sh }
        # The release-please PR only changes version files, so it leaves the few macOS runners to the release.
        exclude: ${{ fromJSON(startsWith(github.head_ref, 'release-please--') && '[{"platform":{"name":"macOS","os":"macos-latest","shell":"sh"}}]' || '[]') }}

    defaults:
      run:
        shell: ${{ matrix.platform.shell }}

    steps:
      # A slow package mirror can fail the setup, so it gets a second try.
      - name: Setup Windows
        id: msys2
        if: matrix.platform.shell == 'msys2 {0}'
        continue-on-error: true
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.platform.msystem }}
          install: >-
            ${{ matrix.platform.msys-env }}-gcc
            ${{ matrix.platform.msys-env }}-cmake
            ${{ matrix.platform.msys-env }}-ninja
            ${{ matrix.platform.msys-env }}-SDL2
            ${{ matrix.platform.msys-env }}-physfs
            ${{ matrix.platform.msys-env }}-boost
            ${{ matrix.platform.msys-env }}-curl
            ${{ matrix.platform.msys-env }}-nlohmann-json
            ${{ matrix.platform.msys-env }}-libarchive
      - name: Wait before the second try
        if: steps.msys2.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 60
      - name: Setup Windows, second try
        if: steps.msys2.outcome == 'failure'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.platform.msystem }}
          install: >-
            ${{ matrix.platform.msys-env }}-gcc
            ${{ matrix.platform.msys-env }}-cmake
            ${{ matrix.platform.msys-env }}-ninja
            ${{ matrix.platform.msys-env }}-SDL2
            ${{ matrix.platform.msys-env }}-physfs
            ${{ matrix.platform.msys-env }}-boost
            ${{ matrix.platform.msys-env }}-curl
            ${{ matrix.platform.msys-env }}-nlohmann-json
            ${{ matrix.platform.msys-env }}-libarchive
      - name: Setup Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install \
            cmake \
            libsdl2-dev \
            libphysfs-dev \
            libboost-test-dev \
            libcurl4-openssl-dev \
            nlohmann-json3-dev \
            libarchive-dev
      - name: Setup MacOS
        if: runner.os == 'macOS'
        run: |
          brew install \
            sdl2 \
            physfs \
            boost \
            nlohmann-json
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # Run the unit tests with AddressSanitizer and UndefinedBehaviorSanitizer, in its own build folder.
      - name: Run unit tests with sanitizers
        if: matrix.platform.os == 'ubuntu-24.04'
        env:
          SANITIZE: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: |
          cmake -S . -B build-sanitize -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="$SANITIZE" -DCMAKE_CXX_FLAGS="$SANITIZE" -DCMAKE_EXE_LINKER_FLAGS="$SANITIZE"
          cmake --build build-sanitize --parallel
          build-sanitize/test/blobbytest 2>&1 | tee sanitize.log
          ! grep -n 'runtime error' sanitize.log
      # Check that blobby builds
      - name: Configure CMake and Build
        run: |
          cmake . -DBLOBBY_SITE_SYNC=ON
          cmake --build .

      # On all systems, run the unit tests
      - name: Run unit tests
        # configure again to build with test this time.
        run: |
          cmake . -DBUILD_TESTS=ON
          cmake --build .
          test/blobbytest
      # On linux, we can try to let blobby run in a virtual framebuffer
      # The runtest target produces an executable that performs a few actions
      # in blobby and then exists
      - name: Run Test Scenario
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install xvfb
          cmake --build . --target blobby-runtest
          xvfb-run src/blobby-runtest
