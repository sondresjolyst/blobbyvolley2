name: Update manifest

# Writes, signs and uploads latest.json for a release. See doc/update-manifest.md.
# Called by the release and by the release repair.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release to write the manifest for, such as v0.1.0"
        type: string
        required: true

jobs:
  sign:
    name: Sign update manifest
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Only this job can read the signing key. It has no write access.
    # The key is a secret of the environment, so the caller does not pass it.
    environment: update-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/update-keys
      - name: Write and sign latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: sh .github/scripts/make-update-manifest.sh "$REPO" "$TAG" manifest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-manifest
          path: |
            manifest/latest.json
            manifest/latest.json.sig
            manifest/keys.json
            manifest/keys.json.sig
          if-no-files-found: error

  upload:
    name: Upload update manifest
    needs: sign
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-manifest
          path: manifest
      - name: Upload the manifest and the keys file
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" manifest/latest.json manifest/latest.json.sig manifest/keys.json manifest/keys.json.sig --repo "$REPO" --clobber
