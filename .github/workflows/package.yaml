name: Packages

on:
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - "AUTHORS"
      - "ChangeLog"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build, comma separated: windows, linux, macos-arm64, macos-x64"
        type: string
        required: false
        default: "windows,linux,macos-arm64,macos-x64"
  workflow_call:
    inputs:
      version:
        description: "Version used in the package names, such as 0.1.0"
        type: string
        required: true
      release_tag:
        description: "Release to attach the packages to, such as v0.1.0. Empty means no upload."
        type: string
        required: false
        default: ""
      platforms:
        description: "Platforms to build, comma separated: windows, linux, macos-arm64, macos-x64"
        type: string
        required: false
        default: "windows,linux,macos-arm64,macos-x64"

# github.workflow is the caller's name in a called run, so the prefix keeps
# this group apart from the caller's group.
concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A pull request has no inputs, so it builds every platform.
jobs:
  windows:
    name: Windows (UCRT64)
    if: github.event_name == 'pull_request' || contains(inputs.platforms, 'windows')
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      package: ${{ steps.name.outputs.package }}

    defaults:
      run:
        shell: msys2 {0}

    steps:
      # A slow package mirror can fail the setup, so it gets a second try.
      - name: Setup MSYS2
        id: msys2
        continue-on-error: true
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ucrt64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-physfs
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-libarchive
      - name: Wait before the second try
        if: steps.msys2.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 60
      - name: Setup MSYS2, second try
        if: steps.msys2.outcome == 'failure'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ucrt64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-physfs
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-libarchive
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build in Release mode
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBLOBBY_SITE_SYNC=ON -DBLOBBY_LAUNCHER=ON
          cmake --build build
      - name: Pick package name
        id: name
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION=$(echo "$SHA" | cut -c1-7)
          fi
          echo "package=blobbyvolley2-tournament-$VERSION-windows-x64" >> "$GITHUB_OUTPUT"
          echo "app=app-$(head -n 1 version.txt | tr -d '\r')" >> "$GITHUB_OUTPUT"
      - name: Package
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          sh .github/scripts/package-windows.sh build "dist/$PACKAGE"
          find dist -type f | sort
      - name: Smoke check the server without MSYS2 on PATH
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
          APP: ${{ steps.name.outputs.app }}
        run: sh .github/scripts/smoke-windows.sh "dist/$PACKAGE/$APP" blobby-server.exe 5
      # blobby.exe is the launcher, which starts the game in the version folder and waits for it.
      - name: Smoke check the launcher and the game without MSYS2 on PATH
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
          APP: ${{ steps.name.outputs.app }}
        run: |
          sh .github/scripts/smoke-windows.sh "dist/$PACKAGE" blobby.exe 8
          state="$(cygpath -u "$APPDATA")/sjolyst-innovation/blobbyvolley2-tournament/launcher"
          cat "$state/launcher.log"
          test -f "$state/started-${APP#app-}" || { echo "::error::The game in $APP did not report that it started"; exit 1; }
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.package }}
          path: dist
          if-no-files-found: error

  windows-release:
    name: Attach Windows to release
    needs: windows
    if: inputs.release_tag != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.windows.outputs.package }}
          path: pkg
      - name: Zip and upload with the start scripts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          PACKAGE: ${{ needs.windows.outputs.package }}
        run: |
          (cd pkg && zip -r -q "../$PACKAGE.zip" "$PACKAGE")
          gh release upload "$TAG" "$PACKAGE.zip" scripts/tournament-server.ps1 scripts/tournament-server.sh --repo "$REPO" --clobber
      # The manifest job signs the hash of this exact zip.
      - name: Keep the release zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.windows.outputs.package }}-zip
          path: ${{ needs.windows.outputs.package }}.zip
          if-no-files-found: error
          overwrite: true

  linux:
    name: Linux (x64)
    if: github.event_name == 'pull_request' || contains(inputs.platforms, 'linux')
    # The oldest Ubuntu in CI, so the package runs on systems with an older glibc too.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      package: ${{ steps.name.outputs.package }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            patchelf \
            libsdl2-dev \
            libphysfs-dev \
            libboost-dev \
            libcurl4-openssl-dev \
            nlohmann-json3-dev \
            libarchive-dev
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build in Release mode
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBLOBBY_SITE_SYNC=ON -DBLOBBY_LAUNCHER=ON
          cmake --build build
      - name: Pick package name
        id: name
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION=$(echo "$SHA" | cut -c1-7)
          fi
          echo "package=blobbyvolley2-tournament-$VERSION-linux-x64" >> "$GITHUB_OUTPUT"
          echo "app=app-$(head -n 1 version.txt)" >> "$GITHUB_OUTPUT"
      - name: Package
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          sh .github/scripts/package-linux.sh build "dist/$PACKAGE"
          find dist -type f | sort
      - name: Smoke check the server
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
          APP: ${{ steps.name.outputs.app }}
        run: sh .github/scripts/smoke-unix.sh "dist/$PACKAGE/$APP" 5 blobby-server --no-daemon --print-msgs
      # blobby is the launcher, which starts the game in the version folder and waits for it.
      - name: Smoke check the launcher and the game
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
          APP: ${{ steps.name.outputs.app }}
          SMOKE_LIBRARIES: "1"
        run: |
          sh .github/scripts/smoke-unix.sh "dist/$PACKAGE" 8 blobby
          state=$(find "${XDG_DATA_HOME:-$HOME/.local/share}" -type d -path '*blobbyvolley2-tournament/launcher' | head -n 1)
          cat "$state/launcher.log"
          test -f "$state/started-${APP#app-}" || { echo "::error::The game in $APP did not report that it started"; exit 1; }
      # Run both again on a newer system that has only the libraries the package expects from the system.
      - name: Smoke check on Debian without the build dependencies
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
          APP: ${{ steps.name.outputs.app }}
        run: |
          docker run --rm -v "$PWD:/src:ro" -e PACKAGE -e APP -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2 \
            sh -c '
              set -eu
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                libgl1 libegl1 libopengl0 libgbm1 libdrm2 libx11-6 libx11-xcb1 libxcb1 \
                libxext6 libxcursor1 libxi6 libxinerama1 libxrandr2 libxrender1 libxss1 libxxf86vm1 libxfixes3 \
                libxkbcommon0 libdecor-0-0 libpulse0 \
                libwayland-client0 libwayland-cursor0 libwayland-egl1 \
                libasound2t64 libdbus-1-3 libsystemd0 libudev1 \
                zlib1g libexpat1 libffi8 libgcrypt20 libgpg-error0 liblzma5 liblz4-1 libzstd1 libcap2 libbsd0 libmd0 > /dev/null
              cp -r "/src/dist/$PACKAGE" /tmp/pkg
              sh /src/.github/scripts/smoke-unix.sh "/tmp/pkg/$APP" 5 blobby-server --no-daemon --print-msgs
              sh /src/.github/scripts/smoke-unix.sh /tmp/pkg 8 blobby
              test -n "$(find "$HOME/.local/share" -path "*launcher/started-${APP#app-}")"
            '
      # tar keeps the permissions, which the artifact upload would lose.
      - name: Archive
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          mkdir out
          tar -C dist -czf "out/$PACKAGE.tar.gz" "$PACKAGE"
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.package }}
          path: out/${{ steps.name.outputs.package }}.tar.gz
          if-no-files-found: error

  linux-release:
    name: Attach Linux to release
    needs: linux
    if: inputs.release_tag != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.linux.outputs.package }}
          path: pkg
      - name: Upload the archive
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ needs.linux.outputs.package }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" "pkg/$PACKAGE.tar.gz" --repo "$REPO" --clobber

  macos:
    name: macOS (${{ matrix.arch }})
    # The release-please PR only changes version files, so it leaves the few macOS runners to the release.
    if: ${{ !startsWith(github.head_ref, 'release-please--') && (github.event_name == 'pull_request' || contains(inputs.platforms, 'macos-')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'pull_request' || (contains(inputs.platforms, 'macos-arm64') && contains(inputs.platforms, 'macos-x64'))) && '[{"arch":"arm64","os":"macos-latest"},{"arch":"x64","os":"macos-26-intel"}]' || contains(inputs.platforms, 'macos-arm64') && '[{"arch":"arm64","os":"macos-latest"}]' || '[{"arch":"x64","os":"macos-26-intel"}]') }}

    steps:
      - name: Install dependencies
        run: brew install sdl2 physfs boost nlohmann-json dylibbundler
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build the app bundle in Release mode
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_MACOS_BUNDLE=ON -DBLOBBY_SITE_SYNC=ON
          cmake --build build --parallel
      - name: Pick package name
        id: name
        env:
          ARCH: ${{ matrix.arch }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION=$(echo "$SHA" | cut -c1-7)
          fi
          echo "package=blobbyvolley2-tournament-$VERSION-macos-$ARCH" >> "$GITHUB_OUTPUT"
      - name: Package
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          sh .github/scripts/package-macos.sh build "dist/$PACKAGE"
          find dist -type f | sort
          lipo -archs "dist/$PACKAGE/Blobby Volley 2 Tournament.app/Contents/MacOS/blobby"
      # The README names the oldest macOS the package runs on. Homebrew builds for the macOS of the runner,
      # so a newer runner image raises it. Warn then, so the README can be updated.
      - name: Check the minimum macOS version
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
          README_MACOS: "26"
        run: |
          find "dist/$PACKAGE" -type f \( -name '*.dylib' -o -path '*/MacOS/blobby' -o -name blobby-server \) | sort | while read -r file; do
            minos=$(vtool -show-build "$file" | awk '$1 == "minos" { print $2; exit }')
            echo "minos $minos: $file"
            if [ -z "$minos" ]; then
              echo "::error::$file has no minimum macOS version"
              exit 1
            fi
            major=${minos%%.*}
            if [ "$major" -gt "$README_MACOS" ]; then
              echo "::warning::$file needs macOS $minos, the README says $README_MACOS"
            fi
          done
      # The smoke checks must not find the libraries in Homebrew.
      - name: Remove the bundled Homebrew formulae
        run: xargs brew uninstall --ignore-dependencies --force < dist/formulae.txt
      - name: Smoke check the server
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: sh .github/scripts/smoke-unix.sh "dist/$PACKAGE/blobby-server" 5 blobby-server --no-daemon --print-msgs
      - name: Smoke check the game
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
          SMOKE_LIBRARIES: "1"
        run: sh .github/scripts/smoke-unix.sh "dist/$PACKAGE" 5 "Blobby Volley 2 Tournament.app/Contents/MacOS/blobby"
      # ditto keeps the symlinks, the permissions and the signatures, which the artifact upload would lose.
      - name: Zip
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          mkdir out
          ditto -c -k --sequesterRsrc --keepParent "dist/$PACKAGE" "out/$PACKAGE.zip"
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.package }}
          path: out/${{ steps.name.outputs.package }}.zip
          if-no-files-found: error

  # Attaches the zips of the macOS builds that passed, so one failed processor does not hold back the other.
  macos-release:
    name: Attach macOS to release
    needs: macos
    if: ${{ !cancelled() && inputs.release_tag != '' && needs.macos.result != 'skipped' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blobbyvolley2-tournament-${{ inputs.version }}-macos-*
          path: pkg
          merge-multiple: true
      - name: Upload the zips
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        run: |
          ls -l pkg
          gh release upload "$TAG" pkg/*.zip --repo "$REPO" --clobber
