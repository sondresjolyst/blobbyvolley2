name: macOS package

on:
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - "AUTHORS"
      - "ChangeLog"
  workflow_call:
    inputs:
      version:
        description: "Version used in the package name, such as 0.1.0"
        type: string
        required: true
      release_tag:
        description: "Release to attach the zips to, such as v0.1.0. Empty means no upload."
        type: string
        required: false
        default: ""
      arch:
        description: "arm64 or x64 builds only that one. Empty builds both."
        type: string
        required: false
        default: ""
      ref:
        description: "Commit, branch or tag to build. Empty means the commit that started the run."
        type: string
        required: false
        default: ""

# github.workflow is the caller's name in a called run, so the prefix keeps
# this group apart from the caller's group. The arch keeps the two calls in a release apart.
concurrency:
  group: macos-${{ inputs.arch }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Package:
    name: macOS (${{ matrix.arch }})
    # The release-please PR only changes version files, so it leaves the few macOS runners to the release.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.arch == 'arm64' && '[{"arch":"arm64","os":"macos-latest"}]' || inputs.arch == 'x64' && '[{"arch":"x64","os":"macos-26-intel"}]' || '[{"arch":"arm64","os":"macos-latest"},{"arch":"x64","os":"macos-26-intel"}]') }}

    steps:
      - name: Install dependencies
        run: brew install sdl2 physfs boost nlohmann-json dylibbundler
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Build the app bundle in Release mode
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_MACOS_BUNDLE=ON -DBLOBBY_SITE_SYNC=ON
          cmake --build build --parallel
      - name: Pick package name
        id: name
        env:
          ARCH: ${{ matrix.arch }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION=$(echo "$SHA" | cut -c1-7)
          fi
          echo "package=blobbyvolley2-tournament-$VERSION-macos-$ARCH" >> "$GITHUB_OUTPUT"
      - name: Package
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          sh .github/scripts/package-macos.sh build "dist/$PACKAGE"
          find dist -type f | sort
          lipo -archs "dist/$PACKAGE/Blobby Volley 2 Tournament.app/Contents/MacOS/blobby"
      # The README names the oldest macOS the package runs on. Homebrew builds for the macOS of the runner,
      # so a newer runner image raises it. Warn then, so the README can be updated.
      - name: Check the minimum macOS version
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
          README_MACOS: "26"
        run: |
          find "dist/$PACKAGE" -type f \( -name '*.dylib' -o -path '*/MacOS/blobby' -o -name blobby-server \) | sort | while read -r file; do
            minos=$(vtool -show-build "$file" | awk '$1 == "minos" { print $2; exit }')
            echo "minos $minos: $file"
            if [ -z "$minos" ]; then
              echo "::error::$file has no minimum macOS version"
              exit 1
            fi
            major=${minos%%.*}
            if [ "$major" -gt "$README_MACOS" ]; then
              echo "::warning::$file needs macOS $minos, the README says $README_MACOS"
            fi
          done
      # The smoke checks must not find the libraries in Homebrew.
      - name: Remove the bundled Homebrew formulae
        run: xargs brew uninstall --ignore-dependencies --force < dist/formulae.txt
      - name: Smoke check the server
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: sh .github/scripts/smoke-unix.sh "dist/$PACKAGE/blobby-server" 5 blobby-server --no-daemon --print-msgs
      - name: Smoke check the game
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
          SMOKE_LIBRARIES: "1"
        run: sh .github/scripts/smoke-unix.sh "dist/$PACKAGE" 5 "Blobby Volley 2 Tournament.app/Contents/MacOS/blobby"
      # ditto keeps the symlinks, the permissions and the signatures, which the artifact upload would lose.
      - name: Zip
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          mkdir out
          ditto -c -k --sequesterRsrc --keepParent "dist/$PACKAGE" "out/$PACKAGE.zip"
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.package }}
          path: out/${{ steps.name.outputs.package }}.zip
          if-no-files-found: error

  Release:
    name: Attach to release
    needs: Package
    if: inputs.release_tag != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blobbyvolley2-tournament-${{ inputs.version }}-macos-${{ inputs.arch || '*' }}
          path: pkg
          merge-multiple: true
      - name: Upload the zips
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        run: |
          ls -l pkg
          gh release upload "$TAG" pkg/*.zip --repo "$REPO" --clobber
