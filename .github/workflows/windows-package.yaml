name: Windows package

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - "AUTHORS"
      - "ChangeLog"
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - "AUTHORS"
      - "ChangeLog"
  workflow_call:
    inputs:
      version:
        description: "Version used in the package name, such as 0.1.0"
        type: string
        required: true
      release_tag:
        description: "Release to attach the zip to, such as v0.1.0. Empty means no upload."
        type: string
        required: false
        default: ""

# github.workflow is the caller's name in a called run, so the prefix keeps
# this group apart from the caller's group.
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Package:
    name: Windows (UCRT64)
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ucrt64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-physfs
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-nlohmann-json
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build in Release mode
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBLOBBY_SITE_SYNC=ON
          cmake --build build
      - name: Package
        run: |
          sh .github/scripts/package-windows.sh build dist/blobby-windows
          find dist -type f | sort
      - name: Smoke check the server without MSYS2 on PATH
        run: sh .github/scripts/smoke-windows.sh dist/blobby-windows blobby-server.exe 5
      - name: Smoke check the game without MSYS2 on PATH
        run: sh .github/scripts/smoke-windows.sh dist/blobby-windows blobby.exe 5
      - name: Pick artifact name
        id: name
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            echo "artifact=blobby-windows-$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=blobby-windows-$(echo "$SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: dist
          if-no-files-found: error

  Release:
    name: Attach to release
    needs: Package
    if: inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.Package.outputs.artifact }}
          path: pkg
      - name: Zip and upload with the start scripts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          asset="blobby-volley-2-$VERSION-windows-x64.zip"
          (cd pkg && zip -r -q "../$asset" blobby-windows)
          gh release upload "$TAG" "$asset" scripts/tournament-server.ps1 scripts/tournament-server.sh --repo "$REPO" --clobber
