name: Linux package

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - "AUTHORS"
      - "ChangeLog"
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - "AUTHORS"
      - "ChangeLog"
  workflow_call:
    inputs:
      version:
        description: "Version used in the package name, such as 0.1.0"
        type: string
        required: true
      release_tag:
        description: "Release to attach the archive to, such as v0.1.0. Empty means no upload."
        type: string
        required: false
        default: ""

# github.workflow is the caller's name in a called run, so the prefix keeps
# this group apart from the caller's group.
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Package:
    name: Linux (x64)
    # The oldest Ubuntu in CI, so the package runs on systems with an older glibc too.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      package: ${{ steps.name.outputs.package }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            patchelf \
            libsdl2-dev \
            libphysfs-dev \
            libboost-dev \
            libcurl4-openssl-dev \
            nlohmann-json3-dev
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build in Release mode
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBLOBBY_SITE_SYNC=ON
          cmake --build build
      - name: Pick package name
        id: name
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION=$(echo "$SHA" | cut -c1-7)
          fi
          echo "package=blobby-volley-2-$VERSION-linux-x64" >> "$GITHUB_OUTPUT"
      - name: Package
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          sh .github/scripts/package-linux.sh build "dist/$PACKAGE"
          find dist -type f | sort
      - name: Smoke check the server
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: sh .github/scripts/smoke-unix.sh "dist/$PACKAGE" 5 blobby-server --no-daemon --print-msgs
      - name: Smoke check the game
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: sh .github/scripts/smoke-unix.sh "dist/$PACKAGE" 5 blobby
      # Run both again on a newer system that has only the libraries the package expects from the system.
      - name: Smoke check on Debian without the build dependencies
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          docker run --rm -v "$PWD:/src:ro" -e PACKAGE \
            debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2 \
            sh -c '
              set -eu
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends libgl1 libegl1 libx11-6 libasound2t64 > /dev/null
              cp -r "/src/dist/$PACKAGE" /tmp/pkg
              sh /src/.github/scripts/smoke-unix.sh /tmp/pkg 5 blobby-server --no-daemon --print-msgs
              sh /src/.github/scripts/smoke-unix.sh /tmp/pkg 5 blobby
            '
      # tar keeps the permissions, which the artifact upload would lose.
      - name: Archive
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          mkdir out
          tar -C dist -czf "out/$PACKAGE.tar.gz" "$PACKAGE"
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.package }}
          path: out/${{ steps.name.outputs.package }}.tar.gz
          if-no-files-found: error

  Release:
    name: Attach to release
    needs: Package
    if: inputs.release_tag != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.Package.outputs.package }}
          path: pkg
      - name: Upload the archive
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ needs.Package.outputs.package }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" "pkg/$PACKAGE.tar.gz" --repo "$REPO" --clobber
