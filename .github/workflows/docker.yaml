name: Docker

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "AUTHORS"
      - "ChangeLog"
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
      - "AUTHORS"
      - "ChangeLog"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build:
    name: Build image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false

  tag:
    name: Pick image tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      latest: ${{ steps.pick.outputs.latest }}
    steps:
      - name: Pick tag
        id: pick
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "tag=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${SHA:0:7}" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

  push:
    name: Push image
    needs: tag
    permissions:
      contents: read
    uses: equinor/ops-actions/.github/workflows/docker.yml@def1359ccd977da6f0720b22328ba6ac02b380ae # v9.43.2
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    with:
      environment: docker-hub
      registry: registry.hub.docker.com
      username: sondresjo
      repository: sondresjo/blobby-server
      tag: ${{ needs.tag.outputs.tag }}
      tag_latest: ${{ needs.tag.outputs.latest == 'true' }}
